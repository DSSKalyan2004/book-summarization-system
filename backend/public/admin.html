<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - User Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .number {
            color: #667eea;
            font-size: 36px;
            font-weight: bold;
        }
        
        .users-table {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-active {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-inactive {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge-admin {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-user {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .badge-online {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .storage-warning {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .storage-warning strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍💼 Admin Dashboard</h1>
            <p style="color: #666; margin-top: 10px;">User Management & Real-Time Login Tracking</p>
            <p style="color: #999; margin-top: 5px; font-size: 12px;">
                🟢 Users show as "Online" if they logged in within the last 15 minutes
            </p>
        </div>
        
        <div id="storageWarning"></div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Online Now</h3>
                <div class="number" id="onlineUsers" style="color: #28a745;">-</div>
            </div>
            <div class="stat-card">
                <h3>Active Users</h3>
                <div class="number" id="activeUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Storage Type</h3>
                <div class="number" id="storageType" style="font-size: 24px;">-</div>
            </div>
        </div>
        
        <div class="users-table">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="refresh-btn" onclick="loadUsers()" style="margin: 0;">🔄 Refresh Data</button>
                <span id="lastUpdated" style="color: #666; font-size: 14px;"></span>
            </div>
            
            <div id="tableContainer">
                <div class="loading">Loading user data...</div>
            </div>
        </div>
    </div>
    
    <script>
        async function loadUsers() {
            try {
                const response = await fetch('/api/auth/admin/users');
                const data = await response.json();
                
                // Update stats
                document.getElementById('totalUsers').textContent = data.total;
                document.getElementById('onlineUsers').textContent = 
                    data.users.filter(u => u.isOnline).length;
                document.getElementById('activeUsers').textContent = 
                    data.users.filter(u => u.isActive).length;
                document.getElementById('storageType').textContent = 
                    data.storage === 'memory' ? '💾 Memory' : '☁️ MongoDB';
                
                // Show storage warning if using memory
                if (data.storage === 'memory' && data.note) {
                    document.getElementById('storageWarning').innerHTML = `
                        <div class="storage-warning">
                            <strong>⚠️ Temporary Storage Warning</strong>
                            ${data.note}
                        </div>
                    `;
                } else {
                    document.getElementById('storageWarning').innerHTML = '';
                }
                
                // Build table
                if (data.users.length === 0) {
                    document.getElementById('tableContainer').innerHTML = `
                        <div class="loading">No users registered yet.</div>
                    `;
                    return;
                }
                
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Online</th>
                                <th>Last Login</th>
                                <th>Registered</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                data.users.forEach(user => {
                    const date = new Date(user.createdAt).toLocaleString();
                    const lastLogin = user.lastLogin ? new Date(user.lastLogin).toLocaleString() : 'Never';
                    const onlineStatus = user.isOnline ? 'Online' : 'Offline';
                    const onlineClass = user.isOnline ? 'online' : 'offline';
                    
                    tableHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td><span class="badge badge-${user.role}">${user.role}</span></td>
                            <td><span class="badge badge-${user.isActive ? 'active' : 'inactive'}">
                                ${user.isActive ? 'Active' : 'Inactive'}
                            </span></td>
                            <td><span class="badge badge-${onlineClass}">${onlineStatus}</span></td>
                            <td>${lastLogin}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
                
                tableHTML += `
                        </tbody>
                    </table>
                `;
                
                document.getElementById('tableContainer').innerHTML = tableHTML;
                
                // Update last updated time
                const now = new Date().toLocaleTimeString();
                document.getElementById('lastUpdated').textContent = `Last updated: ${now}`;
                
            } catch (error) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="loading" style="color: red;">
                        ❌ Error loading users: ${error.message}
                    </div>
                `;
            }
        }
        
        // Load users on page load
        loadUsers();
        
        // Auto-refresh every 2 seconds for real-time updates
        setInterval(loadUsers, 2000);
    </script>
</body>
</html>
