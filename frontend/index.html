
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SummAI — AI-Powered Book Summarization Platform</title>

    <!-- SEO -->
    <meta name="description" content="SummAI uses BERT-powered AI to instantly summarize books, PDFs, DOCX files and web URLs into clear insights and bullet points. Free to use." />
    <meta name="keywords" content="book summarization, AI summary, BERT NLP, PDF summarizer, document intelligence" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#09090b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SummAI — AI-Powered Book Summarization" />
    <meta property="og:description" content="Turn any book, PDF or URL into clear summaries and key insights using BERT AI. Instant results." />
    <meta property="og:site_name" content="SummAI" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SummAI — AI Book Summarizer" />
    <meta name="twitter:description" content="Summarize any document instantly with BERT-powered AI." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=optional" rel="stylesheet" />
    <style>
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #09090b;
        min-height: 100vh;
        color: #fafafa;
        position: relative;
        overflow-x: hidden;
      }
      
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(251, 146, 60, 0.15), transparent),
          radial-gradient(ellipse 60% 50% at 0% 50%, rgba(234, 88, 12, 0.08), transparent),
          radial-gradient(ellipse 60% 50% at 100% 50%, rgba(249, 115, 22, 0.08), transparent);
        pointer-events: none;
        z-index: 0;
      }
      
      #root {
        position: relative;
        z-index: 1;
      }
      
      .glass {
        background: linear-gradient(to bottom, rgba(24, 24, 27, 0.95), rgba(24, 24, 27, 0.9));
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.02) inset,
          0 8px 32px -8px rgba(0, 0, 0, 0.4);
      }
      
      .card-premium {
        background: linear-gradient(to bottom, rgba(24, 24, 27, 0.98), rgba(24, 24, 27, 0.95));
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.03) inset,
          0 20px 60px -15px rgba(0, 0, 0, 0.5),
          0 0 60px -30px rgba(251, 146, 60, 0.08);
      }
      
      .card-premium:hover {
        border-color: rgba(251, 146, 60, 0.2);
        box-shadow: 
          0 0 0 1px rgba(251, 146, 60, 0.1) inset,
          0 20px 60px -15px rgba(0, 0, 0, 0.5),
          0 0 80px -30px rgba(251, 146, 60, 0.15);
      }
      
      .input-premium {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(63, 63, 70, 0.5);
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.02) inset,
          0 2px 8px -2px rgba(0, 0, 0, 0.3);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .input-premium:focus {
        border-color: rgba(251, 146, 60, 0.5);
        background: rgba(24, 24, 27, 0.8);
        box-shadow: 
          0 0 0 1px rgba(251, 146, 60, 0.3) inset,
          0 0 0 3px rgba(251, 146, 60, 0.1),
          0 2px 8px -2px rgba(0, 0, 0, 0.3);
        outline: none;
      }
      
      .input-premium:hover:not(:focus) {
        border-color: rgba(113, 113, 122, 0.6);
        background: rgba(24, 24, 27, 0.7);
      }
      
      /* Professional button gradients */
      .btn-primary {
        background: linear-gradient(to bottom, #f97316, #ea580c);
        border: 1px solid rgba(234, 88, 12, 0.5);
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.1) inset,
          0 2px 8px -2px rgba(234, 88, 12, 0.5),
          0 8px 24px -8px rgba(234, 88, 12, 0.3);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(to bottom, #fb923c, #f97316);
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.15) inset,
          0 2px 8px -2px rgba(234, 88, 12, 0.6),
          0 12px 32px -8px rgba(234, 88, 12, 0.4);
        transform: translateY(-1px);
      }
      
      .btn-primary:active:not(:disabled) {
        transform: translateY(0);
      }
    </style>
<link rel="stylesheet" href="/index.css" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
