services:
  - type: web
    name: book-summarization-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false        # you'll set this in Render dashboard
      - key: JWT_SECRET
        sync: false        # you'll set this in Render dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false        # set to your Vercel URL: https://your-app.vercel.app
